name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        working-directory: packages/feiyue-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Configure Git identity for tests
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Feiyue CI"

      - name: Compile package
        working-directory: packages/feiyue-core
        run: python -m compileall -q feiyue_core

      - name: Run tests
        working-directory: packages/feiyue-core
        run: python -m pytest -q

      - name: Static export-all smoke
        working-directory: packages/feiyue-core
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          mkdir -p "$TMP/project/.hermes/runs/ci-smoke"
          python - "$TMP/project" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          run = root / '.hermes' / 'runs' / 'ci-smoke' / 'run-evidence.json'
          run.write_text(json.dumps({
              'task_id': 'ci-smoke',
              'status': 'blocked',
              'policy_action': 'escalate',
              'policy_reason': 'high_risk_operation',
              'execution_performed': False,
              'retry_performed': False,
              'promotion_status': None,
              'promotion_side_effect_performed': None,
              'approval_exists': False,
              'approval_id': None,
              'approval_approver': None,
              'approval_action': None,
              'approval_applies': False,
              'safe_to_retry': False,
              'next_safe_action': 'request_human_approval',
              'report_paths': {'execution_report': 'execution-report.md'},
          }), encoding='utf-8')
          PY
          python -m feiyue_core.workflow.runs_export_all --root "$TMP/project" --out "$TMP/report" --bundle "$TMP/report.zip" | tee "$TMP/export-all.out"
          grep -q "STATIC_EXPORT_ALL_OK" "$TMP/export-all.out"
          test -f "$TMP/report/index.html"
          test -f "$TMP/report/manifest.json"
          test -f "$TMP/report/runs/ci-smoke.html"
          test -f "$TMP/report.zip"
          test -f "$TMP/report.extracted/manifest.json"

      - name: Provider-free example smoke
        working-directory: packages/feiyue-core
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          python -m feiyue_core.examples.provider_free_smoke \
            --root "$TMP/example-project" \
            --out "$TMP/example-report" \
            --bundle "$TMP/example-report.zip" | tee "$TMP/provider-free-example.out"
          grep -q "PROVIDER_FREE_EXAMPLE_SMOKE_OK" "$TMP/provider-free-example.out"
          test -f "$TMP/example-project/.hermes/runs/m14-provider-free-example-smoke/run-evidence.json"
          test -f "$TMP/example-project/.hermes/runs/m14-provider-free-example-smoke/handoff-summary.md"
          test -f "$TMP/example-report/manifest.json"
          test -f "$TMP/example-report.zip"
          test -f "$TMP/example-report.extracted/manifest.json"

      - name: Provider-free benchmark smoke
        working-directory: packages/feiyue-core
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          python -m feiyue_core.evaluation.benchmark_runner \
            --quick \
            --output "$TMP/benchmark.json" \
            --output-markdown "$TMP/benchmark.md" | tee "$TMP/benchmark.out"
          grep -q "BENCHMARK_SMOKE_OK" "$TMP/benchmark.out"
          grep -q "pass_rate: 0.6667" "$TMP/benchmark.out"
          test -f "$TMP/benchmark.json"
          test -f "$TMP/benchmark.md"

      - name: Secret scan
        run: |
          set -euo pipefail
          ! git grep -I -n -E '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{20,}|-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----)' -- . ':!*.pyc' ':!.git'
          echo SECRET_SCAN_OK
