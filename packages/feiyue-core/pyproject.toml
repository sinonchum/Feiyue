[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "feiyue-core"
version = "0.1.0"
description = "Core schemas and runtime contracts for Feiyue"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.scripts]
feiyue-interruption-demo = "feiyue_core.runtime.interruption_simulation:main"
feiyue-runs = "feiyue_core.workflow.runs_cli:main"
feiyue-runs-api = "feiyue_core.workflow.runs_api:main"
feiyue-runs-export = "feiyue_core.workflow.runs_export:main"
feiyue-runs-export-verify = "feiyue_core.workflow.runs_export_verify:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["feiyue_core"]
