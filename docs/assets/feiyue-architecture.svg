<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc">
  <title id="title">Feiyue provider-free architecture flow</title>
  <desc id="desc">Static diagram showing Human Creative Direction to Strong Spec / Teacher to Task Contract to Weak Worker / Student to Sandbox / Candidate Writes to Verifier to Policy Governor to Run Evidence to Handoff / Dashboard / Static Export Bundle to Curator / Asset Promotion.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#41546f" />
    </marker>
    <style>
      .canvas { fill: #f6f8fb; }
      .panel { fill: #ffffff; stroke: #5c6f86; stroke-width: 2; rx: 12; }
      .role { fill: #eef2f6; stroke: #52667d; stroke-width: 2; rx: 10; }
      .gate { fill: #e8edf3; stroke: #33475f; stroke-width: 2; rx: 10; }
      .evidence { fill: #f1f4f8; stroke: #6a7786; stroke-width: 2; rx: 10; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #182536; font-weight: 700; text-anchor: middle; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #3c4b5d; text-anchor: middle; }
      .caption { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #2e3d4f; font-weight: 700; text-anchor: middle; }
      .arrow { stroke: #41546f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .boundary { stroke: #8391a2; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1120" height="780" />
  <rect class="panel" x="40" y="36" width="1040" height="704" />
  <text class="caption" x="560" y="72">Feiyue Static Provider-Free Architecture</text>

  <rect class="role" x="90" y="120" width="240" height="72" />
  <text class="label" x="210" y="150">Human Creative</text>
  <text class="label" x="210" y="173">Direction</text>

  <rect class="role" x="440" y="120" width="240" height="72" />
  <text class="label" x="560" y="150">Strong Spec /</text>
  <text class="label" x="560" y="173">Teacher</text>

  <rect class="evidence" x="790" y="120" width="240" height="72" />
  <text class="label" x="910" y="162">Task Contract</text>

  <path class="arrow" d="M330 156 H430" />
  <path class="arrow" d="M680 156 H780" />

  <rect class="role" x="790" y="260" width="240" height="72" />
  <text class="label" x="910" y="290">Weak Worker /</text>
  <text class="label" x="910" y="313">Student</text>

  <rect class="evidence" x="440" y="260" width="240" height="72" />
  <text class="label" x="560" y="290">Sandbox /</text>
  <text class="label" x="560" y="313">Candidate Writes</text>

  <rect class="gate" x="90" y="260" width="240" height="72" />
  <text class="label" x="210" y="304">Verifier</text>

  <path class="arrow" d="M910 192 V250" />
  <path class="arrow" d="M790 296 H690" />
  <path class="arrow" d="M440 296 H340" />

  <rect class="gate" x="90" y="400" width="240" height="72" />
  <text class="label" x="210" y="430">Policy</text>
  <text class="label" x="210" y="453">Governor</text>

  <rect class="evidence" x="440" y="400" width="240" height="72" />
  <text class="label" x="560" y="444">Run Evidence</text>

  <rect class="evidence" x="790" y="386" width="240" height="100" />
  <text class="label" x="910" y="417">Handoff / Dashboard /</text>
  <text class="label" x="910" y="440">Static Export Bundle</text>
  <text class="small" x="910" y="465">read-only inspection surfaces</text>

  <path class="arrow" d="M210 332 V390" />
  <path class="arrow" d="M330 436 H430" />
  <path class="arrow" d="M680 436 H780" />

  <rect class="role" x="440" y="580" width="240" height="72" />
  <text class="label" x="560" y="610">Curator / Asset</text>
  <text class="label" x="560" y="633">Promotion</text>

  <path class="arrow" d="M910 486 V616 H690" />

  <path class="boundary" d="M70 222 H1050" />
  <text class="small" x="210" y="218">human and teacher specification boundary</text>
  <text class="small" x="910" y="218">bounded execution begins only after contract evidence</text>

  <path class="boundary" d="M70 530 H1050" />
  <text class="small" x="560" y="556">promotion remains gated by verification, policy, and explicit evidence</text>
</svg>
